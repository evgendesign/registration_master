<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Регистрация бизнеса — мастер Saby</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell" aria-label="Демонстрационный мастер регистрации бизнеса">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Saby — на главную">
        <img src="./assets/bird.svg" width="30" height="40" alt="">
        <span>saby</span>
      </a>
      <nav class="workflow-nav" id="workflowNav" aria-label="Этапы регистрации"></nav>
    </aside>

    <section class="main-view">
      <header class="page-header">
        <h1>Регистрация бизнеса</h1>
        <span class="demo-badge">ДЕМО</span>
      </header>
      <div class="workspace">
        <section class="work-area">
          <div class="profile-line" id="profileLine"></div>
          <div class="screen" id="screen" aria-live="polite"></div>
        </section>
        <aside class="utility-rail" aria-label="Панель Saby">
          <div class="rail-status" aria-hidden="true">ГС<span></span></div>
          <div class="rail-spacer"></div>
          <button class="rail-button" type="button" aria-label="Информация">▣</button>
          <button class="rail-button calendar" type="button" aria-label="Календарь"><b>16</b><small>чт</small></button>
          <button class="rail-button" type="button" aria-label="Звонок">♧</button>
          <button class="rail-button" type="button" aria-label="Сообщения">▱</button>
          <button class="rail-button help-button" type="button" aria-label="Помощь">?</button>
        </aside>
      </div>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
