<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Регистрация бизнеса — мастер Saby</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="prototype-canvas">
  <main class="app-shell" aria-label="Демонстрационный мастер регистрации бизнеса">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Saby — на главную">
        <img src="./assets/bird.svg" width="30" height="40" alt="">
        <span>saby</span>
      </a>
      <nav class="workflow-nav" id="workflowNav" aria-label="Этапы регистрации"></nav>
    </aside>

    <section class="main-view">
      <header class="page-header">
        <h1>Регистрация бизнеса</h1>
      </header>
      <section class="work-area">
        <div class="profile-line" id="profileLine"></div>
        <div class="screen" id="screen" aria-live="polite"></div>
      </section>
    </section>
    <aside class="utility-rail" aria-label="Панель Saby">
      <div class="rail-status" aria-hidden="true">ГС<span></span></div>
      <div class="rail-spacer"></div>
      <button class="rail-button" type="button" aria-label="Информация"><svg class="rail-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3.5h8l3 3v10H5z"></path><path d="M13 3.5v3h3M8 10h5M8 13h5"></path></svg></button>
      <button class="rail-button calendar" type="button" aria-label="Календарь"><b>16</b><small>чт</small></button>
      <button class="rail-button" type="button" aria-label="Звонок"><svg class="rail-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6.1 3.5H9l1.2 3.6-1.8 1.6a11.4 11.4 0 0 0 6.4 6.4l1.6-1.8 3.6 1.2v2.9a1.6 1.6 0 0 1-1.8 1.6A15.9 15.9 0 0 1 3.9 5.3 1.6 1.6 0 0 1 5.5 3.5z"></path></svg></button>
      <button class="rail-button" type="button" aria-label="Сообщения"><svg class="rail-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4.5h14v9H9l-4.5 3v-3H3z"></path></svg></button>
      <button class="rail-button help-button" type="button" aria-label="Помощь">?</button>
    </aside>
  </main>
  <aside class="system-area" aria-label="Системная область прототипа">
    <div class="system-top">
      <div class="device-meta">
        <div class="device-row">
          <button class="device-toggle selected" type="button" data-system-toggle="device" aria-label="Формат ноутбука 4:3" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="13" rx="1.5"></rect><path d="M2.5 19h19l-1.5 2h-16z"></path></svg>
          </button>
        </div>
        <div class="device-label">1024х768&nbsp; ноутбук (4:3)</div>
      </div>
      <section class="screen-picker" aria-label="Состояние прототипа">
        <div class="view-controls">
          <button class="prototype-mode selected" type="button" aria-pressed="true">
            <span class="radio-mark" aria-hidden="true"></span>Типовое представление
          </button>
          <button class="clicks-toggle selected" type="button" data-system-toggle="clicks" aria-pressed="true">
            Клики<span class="switch-mark" aria-hidden="true"></span>
          </button>
        </div>
        <div class="screen-heading">ЭКРАН</div>
        <div class="screen-options" role="radiogroup" aria-label="Экран прототипа">
          <button class="screen-option" type="button" role="radio" aria-checked="false" data-prototype-screen="landing"><span class="radio-mark"></span>Лендинг</button>
          <button class="screen-option selected" type="button" role="radio" aria-checked="true" data-prototype-screen="master"><span class="radio-mark"></span>Начало мастера</button>
          <button class="screen-option" type="button" role="radio" aria-checked="false" data-prototype-screen="signature"><span class="radio-mark"></span>Выдача подписи</button>
          <button class="screen-option" type="button" role="radio" aria-checked="false" data-prototype-screen="work"><span class="radio-mark"></span>Начало работы в Saby</button>
        </div>
      </section>
    </div>
    <section class="system-footer" aria-label="Сведения о прототипе">
      <div class="footer-status"><svg class="meta-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 10s2.7-5 7.5-5 7.5 5 7.5 5-2.7 5-7.5 5-7.5-5-7.5-5z"></path><path d="m4 4 12 12"></path></svg>Не показывали</div>
      <div class="system-info-card">Мастер регистрации бизнеса</div>
      <div class="system-info-card"><svg class="meta-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m13.7 3.3 3 3-9.8 9.8-4 1 1-4z"></path><path d="m11.9 5.1 3 3"></path></svg>Кузнецов Евгений</div>
      <div class="system-info-card"><svg class="meta-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"></circle><path d="M2.8 10h14.4M10 2.5a11.5 11.5 0 0 1 0 15M10 2.5a11.5 11.5 0 0 0 0 15"></path></svg>Магсумов Марат</div>
    </section>
  </aside>
  </div>
  <script src="./app.js"></script>
</body>
</html>
